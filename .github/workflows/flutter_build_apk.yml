name: 构建 Flutter 发布 APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    name: 主要的
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 结账代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # ✅ 重点！删掉仓库残留旧V1安卓工程（普通网上现成模板缺少这一行！）
      - name: 清理旧Android文件夹
        run: rm -rf android

      # ✅ 全新生成 V2 Android
      - name: 生成全新Android V2工程
        run: flutter create . --platforms android

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
