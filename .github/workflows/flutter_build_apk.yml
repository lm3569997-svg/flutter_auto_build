name: 构建 Flutter 发布 APK

on:
  push:
    branches: [ main ]

jobs:
  build_apk:
    name: 主要的
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 结账代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Flutter (3.22.0 → Dart3.4.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # ✅【关键第一步】强制删除仓库残留旧V1 android目录！
      - name: 删除旧的Android工程(V1)
        run: rm -rf android

      # ✅【关键第二步】全新生成 V2 Android工程
      - name: 自动生成全新Android V2宿主工程
        run: flutter create . --platforms android

      - name: 获取依赖项
        run: flutter pub get

      - name: 构建发布 APK
        run: flutter build apk --release

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
